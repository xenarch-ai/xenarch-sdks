[project]
name = "xenarch"
version = "1.0.1"
description = "Xenarch is the non-custodial payment SDK for the agentic internet. Pay for any HTTP 402–gated resource with USDC micropayments on Base L2 (xenarch.x402), and get paid — create and manage pay-links, read payments and subscribers, verify webhooks (xenarch.merchant). Works for humans in scripts and AI agents in workflows. 0% Xenarch fee. Gasless: the wallet only ever holds USDC — no gas coin needed."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Xenarch", email = "hello@xenarch.com"},
]
keywords = [
    "mcp", "mcp-server", "model-context-protocol", "x402", "http-402",
    "ai-agent-payments", "claude", "cursor", "langchain", "crewai",
    "usdc", "base", "base-l2", "non-custodial", "pay-per-crawl",
    "machine-to-machine-payments", "pay-json", "xenarch",
    "payment-links", "merchant", "stablecoin-payments", "webhooks", "sdk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "cryptography>=42",
    # Merchant pay-link signing: keccak256 + EIP-712 typed-data. eth-account
    # pulls eth-utils/eth-hash; we deliberately avoid the heavier web3.
    "eth-account>=0.13",
]

[project.urls]
Homepage = "https://xenarch.com"
Repository = "https://github.com/xenarch-ai/xenarch-sdks"
Documentation = "https://github.com/xenarch-ai/xenarch-sdks/tree/main/python"
Issues = "https://github.com/xenarch-ai/xenarch-sdks/issues"

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
# Framework extras transitively pull x402 because the adapters cannot
# function without it. `pip install xenarch[langchain]` should give a
# working LangChain tool out of the box, not a half-installed package
# that ImportErrors on first use.
x402 = [
    "x402-agent>=0.2,<0.3",
    "pay.json>=1.1,<2",
]
langchain = ["langchain-core>=0.2", "xenarch[x402]"]
autogen = ["autogen-core>=0.4", "xenarch[x402]"]
crewai = ["crewai>=1.0", "xenarch[x402]"]
# LangGraph adapter only needs the payer + an async runtime. We don't
# import langgraph itself in `tools/langgraph.py` (the node is a plain
# async callable), so we don't pin a langgraph version here — callers
# already have it installed if they're wiring graphs.
langgraph = ["xenarch[x402]"]
all = ["xenarch[fastapi,langchain,autogen,crewai,langgraph,x402]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# scripts/ holds dev/smoke utilities (not part of the importable package);
# excluded so they don't ship to PyPI.
exclude = ["tests/", "uv.lock", "scripts/"]

[tool.hatch.build.targets.wheel]
packages = ["xenarch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "contract: tests that hit a live HTTP endpoint (local platform or Coinbase reference). Skipped unless the endpoint is reachable.",
    "property: hypothesis-powered property-based tests. Slower than unit tests.",
]

[tool.mypy]
files = ["xenarch/tools"]
strict = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["x402.*", "pay_json.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fastapi>=0.100",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "langchain>=0.2",
    "autogen-core>=0.4",
    "x402-agent>=0.2,<0.3",
    "pay.json>=1.1,<2",
    "crewai>=1.0",
]
